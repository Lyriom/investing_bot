# Configuracion de Alembic.
#
# La URL de la base NO se pone aqui: se construye en `alembic/env.py` a partir
# de la configuracion del proyecto, que lee variables de entorno. Asi ningun
# secreto termina en un archivo versionado (invariante I5).

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# ruff se distribuye como binario, no como console_script: hay que invocarlo
# con `exec`. Solo corre al generar revisiones, nunca al aplicar migraciones.
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
